<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cash Calculator</h1>

        <div class="row">
            <img src="img/500.jpg"  width="80px" height="50px">
            <input type="number" id="et500" class="cash-input">
            <span id="txt500" class="cash-text">0</span>
        </div>
        <div class="row">
            <img src="img/200.jpg"  width="80px" height="50px">
            <input type="number" id="et200" class="cash-input">

        </div>

            <span id="txt100" class="cash-text">0</span>
        </div>
        <div class="row">
            <img src="img/50.jpg"  width="80px" height="50px">
            <input type="number" id="et50" class="cash-input">
            <span id="txt50" class="cash-text">0</span>
        </div>
        <div class="row">
            <img src="img/20.jpg" width="80px" height="50px">
            <input type="number" id="et20" class="cash-input">
            <span id="txt20" class="cash-text">0</span>
        </div>
        <div class="row">
            <img src="img/10.jpg" width="80px" height="50px">

        </div>

            <img src="img/5.jpg" width="80px" height="50px">

            <span id="txt5" class="cash-text">0</span>
        </div>
        <div class="row">
            <img src="img/2.jpg" width="80px" height="50px">

            <span id="txt2" class="cash-text">0</span>
        </div>
        <div class="row">
            <img src="img/1.jpg" width="80px" height="50px">
            <input type="number" id="et1" class="cash-input">
            <span id="txt1" class="cash-text">0</span>
        </div>

        <div class="row result-part">
            <span id="txtFinalCash">Total Cash</span>
            <span id="txtFinalCashInWords">Zero</span>
        </div>

         <div class="row">
            <button id="btnReset">Clear all</button>

    <script src="script.js"></script>

</html>
